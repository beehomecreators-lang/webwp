services:
  - type: web
    name: bee-home-creators-whatsapp
    runtime: docker
    plan: starter
    dockerfilePath: ./whatsapp-server/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        value: https://lereltbxhekaqhirkpys.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: WHATSAPP_DATA_DIR
        value: /app/data
      - key: PORT
        value: "3001"
    disk:
      name: whatsapp-session-data
      mountPath: /app/data
      sizeGB: 1
